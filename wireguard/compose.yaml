services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - ${CONFIG_LOCATION}:/config
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    env_file:
      - ../.env
      - .env

  wstunnel:
    image: ghcr.io/erebe/wstunnel:latest
    container_name: wstunnel
    command: >
      sh -c "exec /home/app/wstunnel server
      wss://0.0.0.0:8443
      --restrict-to wireguard:51820
      --tls-certificate /certs/wstunnel.pem
      --tls-private-key /certs/wstunnel-key.pem"
    volumes:
      - ${CERTS_PATH}:/certs:ro
    restart: unless-stopped
    depends_on:
      - wireguard
    env_file: ../.env
