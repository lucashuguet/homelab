networks:
  homelab:
    ipam:
      driver: default
      config:
       - subnet: 10.2.0.0/24

include:
  - authentik/compose.yaml
  - beszel/compose.yaml
  - forgejo/compose.yaml
  - homepage/compose.yaml
  - immich/compose.yaml
  # - invidious/compose.yaml
  # - jellyfin/compose.yaml
  - komga/compose.yaml
  - pihole/compose.yaml
  # - searxng/compose.yaml
  - traefik/compose.yaml
  - scrob/compose.yaml
  - vaultwarden/compose.yaml
  - wireguard/compose.yaml

services:
  authentik-server:
    networks: [homelab]
    dns:
      - 10.2.0.254
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`authentik.home.lab`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      - "traefik.http.routers.authentik.tls=true"

  authentik-db:
    networks: [homelab]

  authentik-worker:
    networks: [homelab]

  beszel:
    networks: [homelab]
    dns:
      - 10.2.0.254
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beszel.rule=Host(`beszel.home.lab`)"
      - "traefik.http.routers.beszel.entrypoints=websecure"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"
      - "traefik.http.routers.beszel.tls=true"

  beszel-agent:
    networks: [homelab]
    dns:
      - 10.2.0.254

  forgejo:
    networks: [homelab]
    dns:
      - 10.2.0.254
    ports:
      - "222:22"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`forgejo.home.lab`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
      - "traefik.http.routers.forgejo.tls=true"

  homepage:
    networks: [homelab]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`home.lab`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      - "traefik.http.routers.homepage.tls=true"

  immich-server:
    networks: [homelab]
    dns:
      - 10.2.0.254
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`immich.home.lab`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      - "traefik.http.routers.immich.tls=true"

  immich-machine-learning:
    networks: [homelab]

  immich-redis:
    networks: [homelab]

  immich-db:
    networks: [homelab]

  # invidious:
  #   networks: [homelab]
  #   dns:
  #     - 10.2.0.254
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.invidious.rule=Host(`invidious.home.lab`)"
  #     - "traefik.http.routers.invidious.entrypoints=websecure"
  #     - "traefik.http.services.invidious.loadbalancer.server.port=3000"
  #     - "traefik.http.routers.invidious.tls=true"
  #
  # invidious-companion:
  #   networks: [homelab]
  #   dns:
  #     - 10.2.0.254
  #
  # invidious-db:
  #   networks: [homelab]
  #   dns:
  #     - 10.2.0.254

  # jellyfin:
  #   networks: [homelab]
  #   ports:
  #     - 8096:8096/tcp
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.home.lab`)"
  #     - "traefik.http.routers.jellyfin.entrypoints=websecure"
  #     - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
  #     - "traefik.http.routers.jellyfin.tls=true"

  komga:
    networks: [homelab]
    dns:
      - 10.2.0.254
    ports:
      - "25600:25600"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.komga.rule=Host(`komga.home.lab`)"
      - "traefik.http.routers.komga.entrypoints=websecure"
      - "traefik.http.services.komga.loadbalancer.server.port=25600"
      - "traefik.http.routers.komga.tls=true"
    depends_on:
      authentik-server:
        condition: service_healthy

  unbound:
    networks: [homelab]

  pihole:
    networks:
      homelab:
        ipv4_address: 10.2.0.254
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.home.lab`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      - "traefik.http.routers.pihole.tls=true"
    ports:
      - "53:53/tcp"
      - "53:53/udp"

  # searxng-core:
  #   networks: [homelab]
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.searxng.rule=Host(`searxng.home.lab`)"
  #     - "traefik.http.routers.searxng.entrypoints=websecure"
  #     - "traefik.http.services.searxng.loadbalancer.server.port=8080"
  #     - "traefik.http.routers.searxng.tls=true"
  #
  # searxng-db:
  #   networks: [homelab]

  traefik:
    networks: [homelab]
    ports:
      - "80:80"
      - "443:443"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.home.lab`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls=true"

  scrob-db:
    networks: [homelab]

  scrob:
    networks: [homelab]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scrob.rule=Host(`scrob.home.lab`)"
      - "traefik.http.routers.scrob.entrypoints=websecure"
      - "traefik.http.services.scrob.loadbalancer.server.port=7330"
      - "traefik.http.routers.scrob.tls=true"

  vaultwarden:
    networks: [homelab]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.home.lab`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "traefik.http.routers.vaultwarden.tls=true"

  wireguard:
    networks: [homelab]
    depends_on:
      pihole:
        condition: service_healthy
    ports:
      - "51820:51820/udp"

  wstunnel:
    networks: [homelab]
    ports:
      - 8443:8443/tcp
