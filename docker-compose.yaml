networks:
  homelab:
    ipam:
      driver: default
      config:
       - subnet: 10.2.0.0/24

include:
  - authentik/compose.yaml
  - beszel/compose.yaml
  - forgejo/compose.yaml
  - homepage/compose.yaml
  - immich/compose.yaml
  - komga/compose.yaml
  - pihole/compose.yaml
  - searxng/compose.yaml
  - traefik/compose.yaml
  - wireguard/compose.yaml

services:
  authentik-server:
    networks: [homelab]
    dns:
      - 10.2.0.254
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`authentik.home.lab`)"
      - "traefik.http.routers.authentik.entrypoints=web"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"

  authentik-db:
    networks: [homelab]

  authentik-worker:
    networks: [homelab]

  beszel:
    networks: [homelab]
    dns:
      - 10.2.0.254
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beszel.rule=Host(`beszel.home.lab`)"
      - "traefik.http.routers.beszel.entrypoints=web"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"

  forgejo:
    networks: [homelab]
    dns:
      - 10.2.0.254
    ports:
      - "222:22"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`forgejo.home.lab`)"
      - "traefik.http.routers.forgejo.entrypoints=web"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"

  homepage:
    networks: [homelab]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`home.lab`)"
      - "traefik.http.routers.homepage.entrypoints=web"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"

  immich-server:
    networks: [homelab]
    dns:
      - 10.2.0.254
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`immich.home.lab`)"
      - "traefik.http.routers.immich.entrypoints=web"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"

  immich-machine-learning:
    networks: [homelab]

  immich-redis:
    networks: [homelab]

  immich-db:
    networks: [homelab]

  komga:
    networks: [homelab]
    dns:
      - 10.2.0.254
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.komga.rule=Host(`komga.home.lab`)"
      - "traefik.http.routers.komga.entrypoints=web"
      - "traefik.http.services.komga.loadbalancer.server.port=25600"

  unbound:
    networks: [homelab]

  pihole:
    networks:
      homelab:
        ipv4_address: 10.2.0.254
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.home.lab`)"
      - "traefik.http.routers.pihole.entrypoints=web"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    ports:
      - "53:53/tcp"
      - "53:53/udp"

  searxng-core:
    networks: [homelab]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`searxng.home.lab`)"
      - "traefik.http.routers.searxng.entrypoints=web"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"

  searxng-db:
    networks: [homelab]

  traefik:
    networks: [homelab]
    ports:
      - "80:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.home.lab`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  wireguard:
    networks: [homelab]
    depends_on:
      - pihole
    ports:
      - "51820:51820/udp"
